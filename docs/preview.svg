<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f6ff"/>
      <stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>
  </defs>
  <rect width="640" height="300" fill="url(#bg)"/>
  <!-- left: keep-awake, bright screen -->
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="200" height="125" rx="12" fill="#ffffff" stroke="#3370ff" stroke-width="4"/>
    <rect x="14" y="14" width="172" height="84" rx="6" fill="#fff7df"/>
    <circle cx="100" cy="56" r="26" fill="#f7ba1e"/>
    <path d="M100 18 v10 M100 84 v10 M62 56 h10 M128 56 h10 M73 29 l7 7 M120 76 l7 7 M127 29 l-7 7 M80 76 l-7 7"
          stroke="#f7ba1e" stroke-width="4" stroke-linecap="round"/>
    <path d="M78 112 h44" stroke="#3370ff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- right: display-off, dark screen but system running -->
  <g transform="translate(370,70)">
    <rect x="0" y="0" width="200" height="125" rx="12" fill="#1d2129" stroke="#86909c" stroke-width="4"/>
    <rect x="14" y="14" width="172" height="84" rx="6" fill="#2a2f3a"/>
    <path d="M118 34 a26 26 0 1 0 12 40 a20 20 0 0 1 -12 -40 z" fill="#c9cdd4"/>
    <path d="M78 112 h44" stroke="#86909c" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- center link: running process continues -->
  <path d="M300 132 h40" stroke="#00b42a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="320" cy="132" r="20" fill="#e8ffea" stroke="#00b42a" stroke-width="3"/>
  <path d="M312 132 l6 6 l11 -13" fill="none" stroke="#00b42a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
